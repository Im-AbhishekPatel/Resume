<header class="resume-header">
  <p class="header-line header-name">{{ name }}</p>
  <p class="header-line profile"><span class="profile-text">Sr. Software Engineer</span> <span
      class="profile-separator">|</span> <span class="profile-text">Angular Developer</span></p>
  <p class="header-line header-contact-row">
    <span><i class="fa-solid fa-phone"></i> {{ mobile }}</span> <span> | </span>
    <span><i class="fa-solid fa-location-dot"></i> {{ address }}</span>
  </p>
  <p class="header-line links">
    <a [href]="github" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i> {{ github }}</a>
    <span> | </span>
    <a [href]="linkedin" target="_blank" rel="noopener"><i class="fa-brands fa-linkedin"></i> {{ linkedin }}</a>
  </p>
</header>
